# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deploy Tag
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: The version number of the release

concurrency: WordPress.org

permissions: {}

jobs:
  deploy:
    name: Deploy Tag
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-deploy-tag.yml@dcb8b7626f531708808ba5cf642ff56468c80e42 # optional-attestation
    permissions:
      contents: read
      issues: write
      attestations: write
      id-token: write
    with:
      deploy: true
      attest: false
      plugin: query-monitor
      readme: readme.txt
      version: ${{ github.event_name != 'workflow_dispatch' && github.event.release.tag_name || github.event.inputs.version }}
      username: johnbillion
    secrets:
      WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
  attest:
    name: Attest Tag
    needs: deploy
    uses: ./.github/workflows/attest-tag.yml
    with:
      version: ${{ needs.deploy.outputs.version }}
      zip-path: ${{ needs.deploy.outputs.zip-path }}
