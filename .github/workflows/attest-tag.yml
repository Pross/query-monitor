# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Attest Tag
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: The version number of the release
      zip-path:
        required: true
        type: string
        description: The path to the generated zip file

permissions: {}

jobs:
  wordpress:
    name: WordPress.org
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Fetch artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deployed-query-monitor-${{ inputs.version }}

      - name: Generate build provenance attestation
        uses: johnbillion/action-wordpress-plugin-attestation@b749ddf48d76c82d31a12c8ef336bd76af0a901b # 0.7.1
        with:
          plugin: query-monitor
          version: ${{ inputs.version }}
          zip-path: ${{ inputs.zip-path }}
